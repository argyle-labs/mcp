[package]
name = "mcp"
version = "0.1.0"
# 2024 edition: the federation client uses `if let … && …` let-chains, stable
# only in the 2024 edition (matches the orca workspace edition).
edition = "2024"
description = "Federates MCP servers (stdio + HTTP/SSE) into orca's tool surface — an MCP client"

[package.metadata.orca]
category = "ai"

[lib]
name = "mcp"
path = "src/lib.rs"
# `rlib` retains the in-crate `#[cfg(test)]` harness + lets the workspace use it
# as a normal Rust lib. The plugin artifact is now the `[[bin]]` below — a
# dynamic subprocess the loader spawns, not a dlopened cdylib.
crate-type = ["rlib"]

[[bin]]
name = "mcp"
path = "src/main.rs"

# MCP (Model Context Protocol) client plugin. Federates registered MCP servers
# (stdio + HTTP/SSE transports), maps their tools into orca's namespace, and
# exposes the `mcp.{list, detail, update, delete, run}` tool surface. Pure
# client — there is no MCP service this plugin hosts; it speaks the MCP wire
# protocol to whatever servers the operator registers.

[dependencies]
# The SOLE orca dependency. Every external crate the plugin needs — serde /
# serde_json / schemars / clap / anyhow / async-trait / tracing, wall-clock
# time, the HTTP client + SSE `EventStream` seam (`plugin_toolkit::client`),
# the persistent-child stdio seam (`plugin_toolkit::process`), the shared async
# reactor (`plugin_toolkit::reactor`), the db / dispatch / contract / derive
# surface, and the `utils::{json_schema,path}` helpers — is reached through
# `plugin_toolkit::*` / its prelude / the `#[plugin_struct]` + `#[orca_tool]`
# macros. The plugin names no async runtime, no HTTP client, and no streaming
# crate directly — all such capability is reached through the toolkit seams.
# The only genuinely-external crates are `dirs` and `toml` below.
#
# Pinned to orca `main`, which carries the plugin-toolkit surface (the
# `client` / `process` / `reactor` / `json_schema` / `path` re-exports this
# plugin uses) since the core-seams work merged. Matches the branch = "main"
# convention every other argyle-labs plugin uses. The committed `[patch]` in
# `.cargo/config.toml` resolves this to the local in-tree toolkit at ../orca
# for development; CI ignores the patch and resolves purely from git.
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", default-features = false, features = ["db", "tools", "http", "graphql"] }

# Justified niche dep: `dirs::home_dir()` resolves the OS-specific home dir to
# locate the orca state DB when `ORCA_DB_PATH` is unset. This is a small
# cross-platform path helper the toolkit does not re-export; like `abi_stable`
# it is a genuinely-external crate, not an orca-side capability.
dirs = "5"

# Plugin manifests (`orca-plugin.toml`) are TOML; the toolkit does not
# re-export a TOML parser, so the inlined `manifest::parse_path` (which
# replaced the dropped db-crate `plugin_manifest::parse_path`) needs one
# directly. See the migration report — this is a flagged external dep.
toml = "0.8"

# No async-runtime dep. Request serialization is owned by the seams: the toolkit
# `process::Child` serializes concurrent stdio `request` calls behind its own
# internal lock and correlates by injected id, and each SSE request opens an
# isolated session. The plugin keeps only a plain `AtomicU64` id counter for SSE
# correlation. Async is driven by the shared `plugin_toolkit::reactor`, so the
# plugin names no async runtime, HTTP client, or streaming crate of its own.

[dev-dependencies]
# Dev-only: the in-crate tests reach the toolkit. Async tests run on the shared
# `plugin_toolkit::reactor` (`reactor::block_on`) — no runtime named.
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", default-features = false, features = ["db", "tools", "http", "graphql"] }

# Match orca's workspace lint floor: discarding a Result/Option via
# `let _ = ...` was a load-bearing past incident, so keep it a hard error here
# too — the plugin must stay portable back into the orca workspace.
[lints.clippy]
let_underscore_must_use = "deny"
